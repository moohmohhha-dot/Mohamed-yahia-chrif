services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aruma
      POSTGRES_PASSWORD: aruma
      POSTGRES_DB: aruma
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
volumes:
  pgdata:
