# Every push and pull request: types, all tests (including test/security.test.ts) and a vulnerability
# audit of production dependencies. A red run must be fixed before release (docs/SECURITY.md).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aruma
          POSTGRES_PASSWORD: aruma
          POSTGRES_DB: aruma
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aruma" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://aruma:aruma@localhost:5432/aruma_test
      PAYMENTS_TEST_DATABASE_URL: postgres://aruma:aruma@localhost:5432/aruma_payments_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test databases
        run: psql postgres://aruma:aruma@localhost:5432/aruma -f scripts/create-test-db.sql
      - run: pnpm typecheck
      - name: Tests (core, Payment Service)
        run: pnpm -r --workspace-concurrency=1 test
      - name: Vulnerable production dependencies
        run: pnpm security:audit
